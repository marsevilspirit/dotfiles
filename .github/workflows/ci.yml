name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl fish zsh just ripgrep fd-find
          mkdir -p "${RUNNER_TEMP}/bin"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "${RUNNER_TEMP}/bin"
          ln -s /usr/bin/fdfind "${RUNNER_TEMP}/bin/fd"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: brew install chezmoi just fish zsh ripgrep fd

      - name: Install Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install chezmoi just ripgrep fd -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Neovim nightly and tree-sitter CLI
        run: |
          set -euo pipefail
          ts_binary=tree-sitter
          case "$RUNNER_OS" in
            Linux) nvim_archive=nvim-linux-x86_64; ts_archive=tree-sitter-linux-x64 ;;
            macOS)
              case "$(uname -m)" in
                arm64) nvim_archive=nvim-macos-arm64; ts_archive=tree-sitter-macos-arm64 ;;
                *) nvim_archive=nvim-macos-x86_64; ts_archive=tree-sitter-macos-x64 ;;
              esac ;;
            Windows) nvim_archive=nvim-win64; ts_archive=tree-sitter-windows-x64; ts_binary=tree-sitter.exe ;;
          esac
          nvim_temp="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = Windows ]; then
            nvim_temp=$(cygpath -u "$RUNNER_TEMP")
            curl -fsSL "https://github.com/neovim/neovim/releases/download/nightly/${nvim_archive}.zip" -o "${nvim_temp}/nvim.zip"
            unzip -q "${nvim_temp}/nvim.zip" -d "$nvim_temp"
            cygpath -w "${nvim_temp}/${nvim_archive}/bin" >> "$GITHUB_PATH"
          else
            curl -fsSL "https://github.com/neovim/neovim/releases/download/nightly/${nvim_archive}.tar.gz" | tar xz -C "$RUNNER_TEMP"
            echo "${RUNNER_TEMP}/${nvim_archive}/bin" >> "$GITHUB_PATH"
          fi
          curl -fsSL "https://github.com/tree-sitter/tree-sitter/releases/latest/download/${ts_archive}.gz" \
            | gzip -d > "${nvim_temp}/${nvim_archive}/bin/${ts_binary}"
          chmod +x "${nvim_temp}/${nvim_archive}/bin/${ts_binary}"

      - name: Regression checks and applied Neovim health
        run: python tests/check.py --integration

  cargo-root-probe:
    name: Cargo root probe (${{ matrix.probe }})
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        probe: [1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install Windows tools
        shell: pwsh
        run: |
          choco install chezmoi just ripgrep fd -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Neovim nightly and tree-sitter CLI
        run: |
          set -euo pipefail
          nvim_temp=$(cygpath -u "$RUNNER_TEMP")
          curl -fsSL https://github.com/neovim/neovim/releases/download/nightly/nvim-win64.zip -o "${nvim_temp}/nvim.zip"
          unzip -q "${nvim_temp}/nvim.zip" -d "$nvim_temp"
          curl -fsSL https://github.com/tree-sitter/tree-sitter/releases/latest/download/tree-sitter-windows-x64.gz | gzip -d > "${nvim_temp}/nvim-win64/bin/tree-sitter.exe"
          cygpath -w "${nvim_temp}/nvim-win64/bin" >> "$GITHUB_PATH"
      - name: Probe Cargo with the full regression environment
        run: python tests/check.py
